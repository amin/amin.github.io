<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
    <!--
        The ./ mark, in the same three colours as the logomark in
        assets/images/logo.svg. Keep them in step: this is the same artwork at a
        different size, and a favicon that drifts from the header logo is the
        first thing that looks off.

        The canvas is square and the mark is padded into it rather than filling
        it. Google Search draws a favicon into the square around its circular
        frame and then clips to the circle, so a tall mark on a tall canvas
        loses its top and bottom — which is what the ./ did, showing up as a
        bare diagonal. The mark is 39.65 x 69.43 in its own units, scaled here
        to 53 tall and centred, which puts its bounding box corners ~30.5 from
        centre: inside the 32 radius with room for antialiasing. If the artwork
        below is ever re-cut, keep that half-diagonal under 32.

        The tradeoff to know about is the slash. #D4D4D4 is 13.3:1 on dark
        browser chrome and 1.5:1 on light, so the mark is crisp in a dark tab
        strip and close to invisible on a light one — an active tab in most
        browsers. Matching the logomark was the deliberate choice over being
        easy to spot; darkening the slash here, or letting it follow
        prefers-color-scheme, are the two ways back.
    -->
    <g transform="translate(16.554 5.066) scale(0.76336)">
        <path fill="#D4D4D4" d="M39.087 0.738482C39.7447 0.757895 40.2047 1.39628 40.015 2.02634L19.8151 69.1187C19.6848 69.5517 19.2801 69.8433                                     18.8281 69.83L13.3164 69.6673C12.6587 69.6479 12.1987 69.0095 12.3884 68.3794L32.5883 1.28707C32.7187 0.85409 33.1234                                     0.562458 33.5753 0.575799L39.087 0.738482Z"/>
        <path fill="#D4D4D4" d="M20.096 69.2202C19.9931 69.6762 19.588 70 19.1205 70H11.21H1.419C0.727473 70 0.244676 69.3149 0.477263 68.6637L2.26298                                     63.6637C2.40512 63.2657 2.78211 63 3.20472 63H12.3977H20.2491C20.8902 63 21.3657 63.5948 21.2246 64.2202L20.096 69.2202Z"/>
        <path d="M15.3627 45.2884C15.2355 45.7108 14.8464 46 14.4052 46H8.84535C8.1751 46 7.6946 45.3536 7.8878 44.7118L9.69395                                     38.7118C9.82114 38.2892 10.2102 38 10.6515 38H16.2121C16.8824 38 17.3629 38.6465 17.1696 39.2884L15.3627 45.2884Z" fill="#C65124"/>
        <path d="M11.302 58.1187C11.1716 58.5516 10.767 58.8433 10.315 58.8299L4.80422 58.6674C4.1465 58.648 3.68646 58.0096 3.87616                                     57.3795L5.5826 51.7117C5.7098 51.2892 6.0989 51 6.54014 51H12.0999C12.7702 51 13.2507 51.6465 13.0574 52.2883L11.302                                     58.1187Z" fill="#00808C"/>
    </g>
</svg>
